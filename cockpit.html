<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>机电智能运维平台 · 桥隧场景</title>
  <link rel="icon" type="image/svg+xml" href="assets/platform-logo.svg">
  <link rel="stylesheet" href="demo/style.css">
  <link rel="stylesheet" href="demo/cockpit.css">
  <script>
    window.CESIUM_BASE_URL = new URL('vendor/cesium/', document.baseURI).href;
    if (location.hash === '#/route/qinglan') {
      const model = document.createElement('link');
      model.rel = 'preload';
      model.as = 'fetch';
      model.crossOrigin = 'anonymous';
      model.href = 'assets/3d/songlan-engineering.glb';
      document.head.appendChild(model);
    }
  </script>
  <script type="importmap">
    {"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}
  </script>
  <link rel="modulepreload" href="demo/songlan.js">
</head>
<body class="cockpit-host">
  <div id="spatial">
    <div id="scene-canvas" aria-label="可旋转和缩放的三维路网"></div><div id="scene-labels"></div>
    <div id="songlan-canvas" aria-label="可旋转和缩放的松岚桥隧三维场景" hidden></div>
    <div id="songlan-labels" hidden></div>
    <div id="songlan-loading" class="scene-message" role="status" hidden>正在加载松岚桥隧场景</div>
  </div>
  <div id="app"></div>
  <noscript>请启用 JavaScript 以打开三维原型。</noscript>
  <script src="demo/data.js"></script>
  <script src="demo/model.js"></script>
  <script src="demo/network.js"></script>
  <script src="demo/ui.js"></script>

  <script src="demo/app.js"></script>
</body>
</html>
